/* ---------- views ---------- */
function gameCard(g,t,s,art,tone,delay){return `<button data-a="game" data-g="${g}" class="card hover-lift group relative flex animate-rise ${delay} flex-col overflow-hidden p-0 text-left">
 <div class="relative h-52 overflow-hidden ${tone}"><div class="absolute inset-x-0 bottom-0 top-0 grid place-items-center p-6"><div class="h-full w-full max-w-[220px] animate-floaty transition duration-500 group-hover:scale-105" style="--r:-3deg">${art}</div></div></div>
 <div class="flex items-end justify-between gap-4 p-6"><div><div class="font-display text-2xl font-extrabold tracking-tight">${t}</div><p class="mt-1 text-sm leading-relaxed text-white/60">${s}</p></div><span class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-gold text-ink-950 transition group-hover:translate-x-1">${I.arrow}</span></div></button>`}
function feat(i,t,s){return `<div class="flex gap-4"><span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-white/10 bg-white/5 text-gold">${i}</span><div><div class="font-display text-lg font-bold">${t}</div><p class="mt-0.5 text-sm leading-relaxed text-white/55">${s}</p></div></div>`}
function home(){return `<main class="mx-auto max-w-5xl px-5 pb-16 pt-10 sm:pt-16">
 <section class="animate-rise"><div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-semibold text-white/70"><span class="h-2 w-2 rounded-full bg-leaf"></span>Two classics, one table</div>
 <h1 class="mt-6 max-w-3xl font-display text-[2.9rem] font-extrabold leading-[.98] tracking-tight sm:text-7xl">Naija games.<br><span class="text-gold">Real stakes</span><br>or free play.</h1>
 <p class="mt-6 max-w-xl text-lg leading-relaxed text-white/60">Practise against bots for free, or put money on the table against a real player. Every stake is held in escrow until the result is confirmed.</p></section>
 <section class="mt-12 grid gap-5 md:grid-cols-2">${gameCard("ludo","Naija Ludo","Roll, race and capture. Two to four players.",ludoArt,"bg-[radial-gradient(circle_at_50%_0%,rgba(239,74,58,.35),transparent_70%)]","d1")}${gameCard("whot","Naija Whot","Pick Two, Hold On, General Market. The classic card game.",whotArt,"bg-[radial-gradient(circle_at_50%_0%,rgba(52,210,123,.3),transparent_70%)]","d2")}</section>
 <section class="card mt-5 grid animate-rise gap-7 p-7 d3 sm:grid-cols-3">${feat(I.shield,"Escrow protected","Both stakes are confirmed before a match can start.")}${feat(I.bolt,"Free to practise","Unlimited games against bots. No account needed.")}${feat(I.users,"Peer to peer","Create a match, share the code, play a friend.")}</section>
 <p class="mt-10 text-center text-xs text-white/40">18+ only · Play responsibly · <a href="#admin" class="underline underline-offset-4 hover:text-white/70">Operator</a></p></main>`}

function mode(a,t,s,i,c,extra=""){return `<button data-a="${a}" ${extra} class="card hover-lift group flex w-full items-center gap-5 p-6 text-left"><span class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl ${c}">${i}</span><span class="flex-1"><span class="block font-display text-xl font-extrabold">${t}</span><span class="mt-0.5 block text-sm text-white/55">${s}</span></span><span class="text-white/40 transition group-hover:translate-x-1 group-hover:text-gold">${I.arrow}</span></button>`}
function sec(){return `<main class="mx-auto max-w-xl px-5 pb-16 pt-10"><div class="animate-rise"><div class="${label}">Choose how to play</div><h2 class="mt-2 font-display text-4xl font-extrabold tracking-tight">${NAME[V.g]}</h2></div>

function frame(){return `<iframe id="fr" class="fr" title="${NAME[V.g]}" allow="autoplay"></iframe>`}


/* ---------- backend views ---------- */
function setup(){return `<main class="mx-auto max-w-xl px-5 pt-14"><div class="card p-7"><h2 class="font-display text-3xl font-extrabold">Connect Supabase</h2><p class="mt-3 text-sm leading-relaxed text-white/60">Staked matches need a database. Run <b>ludowhot-schema.sql</b> in the Supabase SQL Editor, then paste your project URL and anon key into <code class="rounded bg-white/10 px-1.5 py-0.5">SUPABASE_URL</code> and <code class="rounded bg-white/10 px-1.5 py-0.5">SUPABASE_ANON_KEY</code> near the top of this file's script. Free play works without it.</p></div></main>`}

function authView(){const up=V.mode==="up";
 return `<main class="mx-auto max-w-sm px-5 pb-16 pt-12"><div class="card animate-rise p-7"><h2 class="font-display text-3xl font-extrabold">${up?"Create account":"Welcome back"}</h2><p class="mt-2 text-sm text-white/55">${up?"You need an account to play for stakes.":"Sign in to create or join staked matches."}</p>
 <form id="authForm" class="mt-5" novalidate>
 ${up?`<label for="an" class="${label}">Nickname</label><input id="an" maxlength="16" autocomplete="nickname" class="${field} mb-4" placeholder="e.g. Tunde">`:""}
 <label for="ae" class="${label}">Email</label><input id="ae" type="email" autocomplete="email" class="${field} mb-4" placeholder="you@email.com">
 <label for="ap" class="${label}">Password</label><input id="ap" type="password" autocomplete="${up?"new-password":"current-password"}" class="${field}" placeholder="At least 8 characters">
 ${up?`<label class="mt-5 flex items-start gap-3 text-sm text-white/70"><input id="aage" type="checkbox" class="mt-1 h-4 w-4 accent-[#f5b83d]"><span>I am 18 or older and I accept the rules of play.</span></label>`:""}
 <button type="submit" class="${btnGold} mt-6 w-full">${up?"Create account":"Sign in"}</button></form>
 <button data-a="swap" class="mt-4 w-full text-center text-sm text-white/60 underline underline-offset-4 hover:text-white">${up?"Already have an account? Sign in":"New here? Create an account"}</button></div></main>`}

function lobby(){
 return `<main class="mx-auto max-w-xl px-5 pb-16 pt-10"><div class="animate-rise"><div class="${label}">Peer to peer</div><h2 class="mt-2 font-display text-4xl font-extrabold tracking-tight">${NAME[V.g]}</h2></div>
 <section class="card mt-8 p-6">
  <label for="nm" class="${label}">Your nickname</label><input id="nm" value="${esc(S.prof?S.prof.nickname:"")}" maxlength="16" placeholder="e.g. Tunde" class="${field}">
  <div class="${label} mt-6">Stake per player</div><div class="mt-3 grid grid-cols-3 gap-2.5">${STAKES.map(s=>`<button data-a="stake" data-n="${s}" aria-pressed="${V.stake===s}" class="rounded-2xl border py-3.5 font-display text-lg font-bold transition ${V.stake===s?"border-gold bg-gold text-ink-950":"border-white/10 bg-white/5 hover:bg-white/10"}">${naira(s)}</button>`).join("")}</div>
  <dl class="mt-5 space-y-2 rounded-2xl bg-black/25 p-4 text-sm"><div class="flex justify-between text-white/60"><dt>Stake</dt><dd>${naira(V.stake)}</dd></div><div class="flex justify-between text-white/60"><dt>Service fee</dt><dd>${naira(FEE())}</dd></div><div class="flex justify-between border-t border-white/10 pt-2 text-base font-semibold"><dt>You pay</dt><dd class="text-gold">${naira(V.stake+FEE())}</dd></div><div class="flex justify-between text-leaf"><dt>Winner receives</dt><dd class="font-bold">${naira(V.stake*2)}</dd></div></dl>
  <button data-a="create" class="${btnGold} mt-5 w-full">Create match</button></section>
 <section class="card mt-5 p-6"><label for="code" class="${label}">Have a match code?</label><div class="mt-2 flex gap-2"><input id="code" maxlength="5" placeholder="CODE" class="${field} mt-0 uppercase tracking-[.3em]"><button data-a="joinc" class="${btnGhost}">Join</button></div></section>
 <div class="${label} mb-3 mt-8">Open matches</div><div class="space-y-3">${openList.length?openList.map(m=>`<div class="card flex items-center justify-between p-4"><div><div class="font-display text-lg font-bold">${naira(m.stake)} <span class="text-sm font-medium text-white/50">stake</span></div><div class="text-xs text-white/50">${esc(m.nickname)} · code <span class="font-mono tracking-widest">${esc(m.code)}</span></div></div>${m.mine?`<button data-a="open" data-m="${esc(m.code)}" class="rounded-xl border border-white/10 bg-white/5 px-5 py-2.5 font-bold hover:bg-white/10">Open</button>`:`<button data-a="join" data-m="${esc(m.code)}" class="rounded-xl bg-gold px-5 py-2.5 font-bold text-ink-950 hover:bg-gold-soft">Join</button>`}</div>`).join(""):'<div class="rounded-2xl border border-dashed border-white/15 p-6 text-center text-sm text-white/45">No open matches yet. Create one and share the code.</div>'}</div></main>`}
const FEE=()=>+(S.cfg.fee||25);

const cp=t=>`<button data-a="copy" data-t="${esc(t)}" class="cp">Copy</button>`;
function row(l,v,c){return `<div class="flex items-center justify-between gap-3 border-b border-white/[.07] py-3 last:border-0"><div class="min-w-0"><div class="text-xs text-white/50">${l}</div><div class="truncate font-display text-lg font-bold">${esc(v)}</div></div>${c?cp(c):""}</div>`}
function escrow(){const m=cur;if(!m)return `<main class="px-5 pt-14 text-center text-white/60">Match not found.</main>`;
 const s=m.my_seat,me=m.seats.find(x=>x.seat===s)||{},opp=m.seats.find(x=>x.seat!==s),amt=m.stake+m.fee,ref=`LW-${m.id}-${s+1}`;
 const won=m.status==="done"&&m.winner_seat===s,lost=m.status==="done"&&m.winner_seat!==s;
 return `<main class="mx-auto max-w-xl px-5 pb-16 pt-10"><div class="animate-rise"><div class="${label}">${NAME[m.game]} · code <span class="font-mono tracking-widest text-gold">${esc(m.id)}</span></div><h2 class="mt-2 font-display text-4xl font-extrabold tracking-tight">${m.status==="done"?"Result":m.status==="cancelled"?"Cancelled":"Escrow console"}</h2></div>
 ${m.status==="done"?`<section class="card mt-8 p-6 text-center"><div class="font-display text-3xl font-extrabold ${won?"text-leaf":"text-white"}">${won?"You won "+naira(m.stake*2):esc((m.seats.find(x=>x.seat===m.winner_seat)||{}).nickname)+" won"}</div><p class="mt-2 text-sm text-white/55">${won?(m.paid_out?"Your winnings have been paid out.":"The operator will pay out to the account you gave."):"Better luck next time."}</p></section>`:""}
 <section class="card mt-8 p-6"><div class="flex justify-between text-sm text-white/60"><span>Stake</span><b class="text-white">${naira(m.stake)}</b></div><div class="mt-2 flex justify-between text-sm text-white/60"><span>Service fee</span><b class="text-white">${naira(m.fee)}</b></div><div class="mt-3 flex items-end justify-between border-t border-white/10 pt-3"><span class="text-white/70">You pay</span><b class="font-display text-3xl text-gold">${naira(amt)}</b></div><div class="mt-1 text-right text-xs text-white/50">Winner receives ${naira(m.stake*2)}</div></section>
 ${["open","funding"].includes(m.status)?`<section class="card mt-4 p-6"><div class="mb-1 flex items-center gap-2 font-display text-lg font-bold text-gold">${I.shield}Send payment to escrow</div>${row("Bank",S.cfg.bank_name||"")}${row("Account number",S.cfg.bank_account_number||"",S.cfg.bank_account_number)}${row("Account name",S.cfg.bank_account_name||"",S.cfg.bank_account_name)}${row("Amount",naira(amt),amt)}${row("Narration / reference",ref,ref)}<p class="mt-3 text-xs leading-relaxed text-white/50">Use the reference as your transfer narration so the operator can match it.</p></section>
 <div class="mt-5"><label for="po" class="${label}">Where should we send your winnings?</label><input id="po" value="${esc(me.payout||"")}" placeholder="Bank + account number, e.g. GTBank 0123456789" class="${field}"></div>
 ${me.payment_status==="none"||me.payment_status==="rejected"?`<button data-a="pay" class="mt-4 w-full rounded-2xl bg-leaf px-5 py-3.5 font-display text-lg font-bold text-ink-950 transition hover:brightness-110">I have paid ${naira(amt)}</button>`:""}`:""}
 <div class="mt-6 space-y-2.5"><div class="card flex items-center justify-between gap-3 p-4 text-sm"><span class="font-semibold">You (${esc(me.nickname)})</span>${PS[me.payment_status]}</div><div class="card flex items-center justify-between gap-3 p-4 text-sm"><span class="font-semibold">${opp?esc(opp.nickname):"Opponent"}</span>${opp?PS[opp.payment_status]:pill("Waiting for opponent","bg-white/10 text-white/70")}</div></div>
 ${m.status==="playing"?`<p class="mt-4 text-center text-sm text-white/60">${me.report==null?"Match is on.":"You reported: <b>"+(me.report?"I won":"I lost")+"</b>. Waiting for the operator."}</p><button data-a="start" class="${btnGold} mt-4 flex w-full items-center justify-center gap-2">${me.report==null?"Go to table":"Back to table"}</button>`
  :m.status==="funding"&&both(m)?`<button data-a="start" class="${btnGold} mt-6 flex w-full items-center justify-center gap-2">${I.check}Both payments confirmed · Start match</button>`
  :["open","funding"].includes(m.status)?`<button data-a="refresh" class="${btnGhost} mt-6 w-full">Refresh status</button>`:""}
 ${m.status==="open"&&s===0&&me.payment_status==="none"?`<button data-a="cancel" class="mt-3 w-full text-center text-sm text-white/50 underline underline-offset-4 hover:text-white">Cancel this match</button>`:""}
 <p class="mt-4 text-center text-xs leading-relaxed text-white/45">Funds are released only after the operator confirms the result. Payments are confirmed manually.</p></main>`}

function play(){return `<div class="flex min-h-12 flex-wrap items-center justify-between gap-2 border-b border-white/5 bg-gold/10 px-4 py-2 text-xs"><span class="max-w-[60%] text-gold-soft">Opponent moves are not live-synced. Report the result honestly; the operator reviews every dispute.</span><span class="flex gap-1.5"><button data-a="rep" data-w="1" class="rounded-lg bg-leaf px-3 py-1.5 font-bold text-ink-950">I won</button><button data-a="rep" data-w="0" class="rounded-lg bg-chili px-3 py-1.5 font-bold text-white">I lost</button></span></div><iframe id="fr" style="height:calc(100dvh - 112px - env(safe-area-inset-top,0px))" title="${NAME[cur?cur.game:V.g]}" allow="autoplay"></iframe>`}

function stat(l,v,c=""){return `<div class="card p-4 text-center"><div class="text-[11px] font-semibold uppercase tracking-wider text-white/50">${l}</div><b class="mt-1 block font-display text-3xl ${c}">${v}</b></div>`}
function admin(){
 if(!S.user)return authView();
 if(!S.prof||S.prof.role!=="operator")return `<main class="mx-auto max-w-sm px-5 pt-14"><div class="card p-7 text-center"><h2 class="font-display text-2xl font-extrabold">No access</h2><p class="mt-2 text-sm text-white/55">This console is for operators only.</p></div></main>`;
 const ms=opList,fees=ms.filter(m=>both(m)).length*FEE()*2;
 return `<main class="mx-auto max-w-3xl px-5 pb-16 pt-10"><h2 class="font-display text-4xl font-extrabold tracking-tight">Operator console</h2><div class="mt-6 grid grid-cols-3 gap-3">${stat("Matches",ms.length)}${stat("Awaiting you",ms.reduce((a,m)=>a+m.seats.filter(s=>s.payment_status==="pending").length,0),"text-gold-soft")}${stat("Fees earned",naira(ms.filter(m=>m.status==="done"||m.status==="playing").length*FEE()*2),"text-gold")}</div>
 <div class="mt-6 space-y-4">${ms.length?ms.map(am).join(""):'<div class="rounded-2xl border border-dashed border-white/15 p-8 text-center text-sm text-white/45">No matches yet.</div>'}</div></main>`}
function am(m){const w=m.winner_seat;return `<div class="card p-5"><div class="flex items-center justify-between"><b class="font-display text-lg">${NAME[m.game]} · ${naira(m.stake)}</b><span class="flex items-center gap-2 text-xs text-white/50"><span class="rounded-full bg-white/10 px-2 py-0.5">${m.status}</span><span class="font-mono tracking-widest">${esc(m.id)}</span></span></div>
 ${m.seats.map(s=>`<div class="mt-3 rounded-2xl bg-black/25 p-4 text-sm"><div class="flex items-center justify-between gap-2"><b>${esc(s.nickname)}</b>${PS[s.payment_status]}</div><div class="mt-1 text-xs text-white/50">Ref LW-${esc(m.id)}-${s.seat+1} · expects ${naira(m.stake+m.fee)} · payout: ${esc(s.payout)||"not given"}</div>${s.report!=null?`<div class="mt-1 text-xs text-gold-soft">Reports: ${s.report?"I won":"I lost"}</div>`:""}
 <div class="mt-3 flex flex-wrap gap-2">${s.payment_status==="pending"&&["open","funding"].includes(m.status)?`<button data-a="ok" data-m="${esc(m.id)}" data-s="${s.seat}" class="rounded-lg bg-leaf px-3 py-1.5 font-bold text-ink-950">Confirm payment</button><button data-a="no" data-m="${esc(m.id)}" data-s="${s.seat}" class="rounded-lg bg-chili px-3 py-1.5 font-bold">Reject</button>`:""}${m.status==="playing"?`<button data-a="win" data-m="${esc(m.id)}" data-s="${s.seat}" class="rounded-lg bg-gold px-3 py-1.5 font-bold text-ink-950">${esc(s.nickname)} won</button>`:""}</div></div>`).join("")}
 ${m.seats.length<2?'<div class="mt-3 rounded-2xl border border-dashed border-white/10 p-3 text-sm text-white/45">Seat open</div>':""}
 ${w!=null?`<div class="mt-4 flex flex-wrap items-center gap-2 rounded-2xl border border-gold/25 bg-gold/10 p-4 text-sm">Winner: <b>${esc((m.seats.find(s=>s.seat===w)||{}).nickname)}</b>. Pay <b>${naira(m.stake*2)}</b> to ${esc((m.seats.find(s=>s.seat===w)||{}).payout)||"(no account given)"}. ${m.paid_out?pill("Paid out","bg-leaf/20 text-emerald-200"):`<button data-a="paid" data-m="${esc(m.id)}" class="ml-auto rounded-lg bg-leaf px-3 py-1.5 font-bold text-ink-950">Mark paid out</button>`}</div>`:""}</div>`}

/* ---------- routing ---------- */
function render(){const needs=["lobby","escrow","play","admin","auth"].includes(V.v);
 let b;if(needs&&!sb)b=setup();else if(["lobby","escrow","play"].includes(V.v)&&!S.user)b=authView();else b={home,sec,free:frame,lobby,escrow,play,admin,auth:authView}[V.v]();
 app.innerHTML=head()+b;const f=$("fr");if(f)f.srcdoc=G[V.g||(cur||{}).game]}
const back={sec:{v:"home"},free:()=>({v:"sec",g:V.g}),lobby:()=>({v:"sec",g:V.g}),escrow:()=>({v:"lobby",g:V.g}),play:()=>({v:"escrow",g:V.g,code:V.code}),admin:{v:"home"},auth:{v:"home"}};
async function fetchData(){
 if(!sb||!S.user)return;
 try{
  if(V.v==="lobby")openList=await rpc("list_open_matches",{p_game:V.g})||[];
  if(V.v==="escrow"||V.v==="play"){cur=await rpc("get_match",{p_code:V.code});if(cur)V.g=cur.game}
  if(V.v==="admin"&&S.prof&&S.prof.role==="operator")opList=await rpc("op_list")||[];
 }catch(e){}}
async function go(o){V=Object.assign({stake:V.stake,mode:V.mode},o);await fetchData();render();scrollTo(0,0)}
let last="";
setInterval(async()=>{if(document.hidden||!S.user||!["lobby","escrow","play","admin"].includes(V.v))return;
 const ae=document.activeElement;if(ae&&ae.tagName==="INPUT")return;
 const was=JSON.stringify([cur,openList,opList]);await fetchData();
 if(JSON.stringify([cur,openList,opList])!==was&&V.v!=="play")render()},5000);

/* ---------- events ---------- */
app.addEventListener("submit",async e=>{if(e.target.id!=="authForm")return;e.preventDefault();if(busy)return;
 const email=$("ae").value.trim(),pw=$("ap").value,up=V.mode==="up";
 if(!email||pw.length<8)return toast("Enter your email and a password of at least 8 characters");
 busy=true;
 try{
  if(up){const nick=$("an").value.trim();if(!nick)return toast("Choose a nickname");if(!$("aage").checked)return toast("You must be 18 or older to play");
   const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{nickname:nick}}});if(error)return toast(error.message);
   if(!data.session){V.mode="in";render();return toast("Account created. Check your email to confirm it, then sign in.")}}
  else{const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)return toast(error.message)}
  await new Promise(r=>setTimeout(r,400));
  const t=["lobby","escrow","play","admin"].includes(V.v)?{...V}:(V.after&&V.after.v!=="auth"?V.after:{v:"home"});
  await go(t);
 }finally{busy=false}});

app.addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,d=el.dataset;
 if(a==="home")return go({v:"home"});
 if(a==="back"){const b=back[V.v];return go(typeof b==="function"?b():b)}
 if(a==="game")return go({v:"sec",g:d.g});
 if(a==="free")return go({v:"free",g:V.g});
 if(a==="lobby")return go({v:"lobby",g:V.g});
 if(a==="toauth")return go({v:"auth",after:{v:V.v,g:V.g,code:V.code}});
 if(a==="swap"){V.mode=V.mode==="up"?"in":"up";return render()}
 if(a==="adminhome")return go({v:"admin"});
 if(a==="signout"){await sb.auth.signOut();cur=null;return go({v:"home"})}
 if(a==="stake"){V.stake=+d.n;const n=$("nm").value;render();$("nm").value=n;return}
 if(a==="copy"){try{navigator.clipboard.writeText(d.t)}catch(x){}el.textContent="Copied";return setTimeout(()=>el.textContent="Copy",1200)}
 if(a==="refresh"){await fetchData();return render()}
 if(busy)return;busy=true;
 try{
  if(a==="create"||a==="join"||a==="joinc"){
   const n=$("nm").value.trim();if(!n){$("nm").focus();return toast("Choose a nickname first")}
   if(!S.prof||S.prof.nickname!==n){await rpc("set_nickname",{p_nickname:n});S.prof={...S.prof,nickname:n}}
   if(a==="create"){const code=await rpc("create_match",{p_game:V.g,p_stake:V.stake,p_nickname:n});return await go({v:"escrow",code})}
   const code=(a==="join"?d.m:$("code").value).trim().toUpperCase();if(!code)return toast("Enter a match code");
   await rpc("join_match",{p_code:code,p_nickname:n});return await go({v:"escrow",code})}
  if(a==="open")return await go({v:"escrow",code:d.m});
  if(a==="pay"){await rpc("mark_paid",{p_code:V.code,p_payout:$("po").value});return await go({v:"escrow",code:V.code})}
  if(a==="cancel"){await rpc("cancel_match",{p_code:V.code});return await go({v:"lobby",g:V.g})}
  if(a==="start"){await rpc("start_match",{p_code:V.code});return await go({v:"play",code:V.code})}
  if(a==="rep"){await rpc("report_result",{p_code:V.code,p_won:d.w==="1"});return await go({v:"escrow",code:V.code})}
  if(a==="ok"||a==="no"){await rpc("op_confirm",{p_code:d.m,p_seat:+d.s,p_ok:a==="ok"})}
  else if(a==="win"){if(!confirm("Set this player as the winner? This cannot be undone."))return;await rpc("op_set_winner",{p_code:d.m,p_seat:+d.s})}
  else if(a==="paid"){await rpc("op_mark_paid_out",{p_code:d.m})}
  else return;
  await fetchData();render();
 }catch(err){}finally{busy=false}});

if(sb){sb.auth.onAuthStateChange((_e,s)=>{setTimeout(async()=>{await loadSession(s);if(V.v!=="home"&&V.v!=="sec"&&V.v!=="free")await fetchData(),render()},0)})}
else render();
</script>
